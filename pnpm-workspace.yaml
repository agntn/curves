packages:
  - docs

gitChecks: false

allowBuilds:
  "@google/genai": false
  better-sqlite3: true
  core-js-pure: false
  esbuild: true
  onnxruntime-node: false
  protobufjs: false
  sharp: false
  vue-demi: true
  workerd: true

# A frozen install refuses day-old releases. The @agntn glob keeps CI green when a sibling ships.
minimumReleaseAgeExclude:
  - "@agntn/*"
  - "@oh-my-pi/hashline@18.0.0"
  - "@oh-my-pi/omp-stats@18.0.0"
  - "@oh-my-pi/omptype@18.0.0"
  - "@oh-my-pi/pi-agent-core@18.0.0"
  - "@oh-my-pi/pi-ai@18.0.0"
  - "@oh-my-pi/pi-catalog@18.0.0"
  - "@oh-my-pi/pi-coding-agent@18.0.0"
  - "@oh-my-pi/pi-mnemopi@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-darwin-x64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-arm64@18.0.0"
  - "@oh-my-pi/pi-natives-linux-x64@18.0.0"
  - "@oh-my-pi/pi-natives-win32-x64@18.0.0"
  - "@oh-my-pi/pi-natives@18.0.0"
  - "@oh-my-pi/pi-tui@18.0.0"
  - "@oh-my-pi/pi-utils@18.0.0"
  - "@oh-my-pi/pi-wire@18.0.0"
  - "@oh-my-pi/snapcompact@18.0.0"
  - "@voidzero-dev/vite-plus-core@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0"
  - vite-plus@1.0.0

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0

# One version per name for the library and docs/, whose playground and /mcp route run the library.
catalogs:
  deps:
    "@agntn/hashes": 0.6.7
    "@agntn/tools": 0.2.4
    "@modelcontextprotocol/sdk": 1.30.1
    "@modelcontextprotocol/server": 2.2.0
    "@nuxtjs/mcp-toolkit": 0.23.0
    "@vueuse/core": 14.4.0
    agents: 0.26.0
    better-sqlite3: 12.11.1
    docus: 5.15.0
    nuxt: 4.6.3
    ufo: 1.6.4
    zod: 4.6.5
  dev:
    "@agntn/ox": 0.1.0
    "@earendil-works/pi-coding-agent": 1.0.2
    "@iconify-json/lucide": 1.2.149
    "@iconify-json/simple-icons": 1.2.101
    "@iconify-json/token": 1.2.42
    "@iconify-json/vscode-icons": 1.2.94
    "@modelcontextprotocol/client": 2.2.0
    "@nuxt/content": 3.16.1
    "@oh-my-pi/pi-coding-agent": 18.4.12
    "@types/node": 26.2.0
    ai: 7.0.66
    changelogen: 0.6.2
    obuild: 0.4.43
    shiki: 4.5.0
    typescript: 7.0.2
    vue: 3.5.44
    vue-tsc: 3.3.12
    wrangler: 4.128.0
  # vue-tsc and the Nuxt type generation need the TypeScript API, which 7 no longer ships.
  nuxt:
    typescript: 5.9.3

cleanupUnusedCatalogs: true

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"

# Stops pnpm 12 from opening the lockfile with an env document, which GitHub reads as zero dependencies.
pmOnFail: ignore
