packages:
  - .

# Without it Node walks up to the root node_modules and the worker can bundle a second Vue.
shamefullyHoist: true

allowBuilds:
  better-sqlite3: true
  esbuild: true
  workerd: true
  vue-demi: true
  core-js-pure: false

# Workers Builds installs frozen and refuses day-old releases. This lets every @agntn one in.
minimumReleaseAgeExclude:
  - "@agntn/*"
