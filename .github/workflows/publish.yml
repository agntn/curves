name: Publish

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v0.2.0
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      # Installs docs/ too: test/docs-mcp.test.ts takes Zod, the toolkit and the SDK from there.
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version: 26.12.1
          registry-url: https://registry.npmjs.org
          run-install: |
            - cwd: .
              args: ['--frozen-lockfile']
            - cwd: docs
              args: ['--frozen-lockfile']

      - run: pnpm build

      - run: pnpm test

      - run: pnpm publish
